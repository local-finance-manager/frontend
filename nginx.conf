server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Serve static assets with cache
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy API calls to Go backend
    location /api/ {
        proxy_pass         http://api:19742;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # SPA fallback — all other routes go to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html nunca em cache: assets são hasheados (immutable), mas o HTML
    # precisa ser sempre revalidado para que um novo deploy (hash novo dos assets)
    # seja carregado imediatamente — sem isso o browser fica preso no bundle antigo.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }
}
